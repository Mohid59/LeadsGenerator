name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  filter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('n8n/workflow.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apify/input.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apify/input.pakistan.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apify/input.gulf.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apify/input.global-en.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('tests/sample-input.json','utf8'))"

      - name: Run filter tests
        run: node tests/test-runner.js
